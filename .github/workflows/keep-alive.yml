name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 9 * * 1'   # Her Pazartesi saat 09:00 UTC
  workflow_dispatch:        # Elle de tetikleyebilmek için

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/?apikey=${{ secrets.VITE_SUPABASE_ANON_KEY }}"